name: CI Pipeline

on:
  push:
    branches: [ develop, release/*, main ]
  pull_request:
    branches: [ develop, release/*, main ]

jobs:
  lint:
    name: Lint HTML & CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install HTMLHint
        run: npm install -g htmlhint
      - name: Lint all HTML files
        run: htmlhint "*.html" --config .htmlhintrc
      - name: Report success
        run: echo "HTML lint passed"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (CI check, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cs-dept-website:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Confirm build success
        run: echo "Docker image built for commit ${{ github.sha }}"
