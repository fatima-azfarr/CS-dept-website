name: CD — Production

on:
  push:
    branches: [ main ]

environment: production

jobs:
  deploy-production:
    name: Deploy to Production (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cs-dept-website:prod-${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/cs-dept-website:latest
      - name: Trigger Render Deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}" --fail
          echo "Production deploy triggered"
